<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 小镇</title>
  </head>
  <body>
    <div id="stage">
      <div id="game"></div>
      <!-- HUD：文字 UI 用 DOM（清晰），像素世界用 Canvas -->
      <div id="hud">
        <button id="event-log-toggle" type="button">📜 小镇播报</button>
        <div id="event-log" class="hidden"></div>
        <div id="hint" class="hidden"></div>
        <div id="chat-panel" class="hidden">
          <div id="chat-title"></div>
          <div id="chat-history"></div>
          <input
            id="chat-input"
            type="text"
            maxlength="200"
            placeholder="说点什么…（Enter 发送，Esc 关闭）"
            autocomplete="off"
          />
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
